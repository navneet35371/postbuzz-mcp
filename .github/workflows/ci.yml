name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `bun run` executes the scripts under Node (vitest, tsc, tsup);
      # `bun test` would use Bun's own runner instead.
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
